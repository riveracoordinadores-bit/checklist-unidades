<style>
:root{--bg:216 32% 97%;--card:0 0% 100%;--fg:215 45% 13%;--pri:213 60% 27%;--acc:216 82% 52%;--mut:215 28% 94%;--bd:215 24% 88%;--des:0 72% 45%;--mf:215 15% 45%;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:215 40% 8%;--card:215 35% 12%;--fg:210 30% 94%;--pri:213 70% 62%;--acc:216 85% 62%;--mut:215 25% 17%;--bd:215 22% 22%;--mf:215 15% 65%}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:hsl(var(--bg));color:hsl(var(--fg));font-family:Manrope,system-ui,sans-serif;font-size:15px}
.mono,.k{font-family:'IBM Plex Mono',ui-monospace,monospace}
.k{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:hsl(var(--mf))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:hsl(var(--card));border-bottom:1px solid hsl(var(--bd));display:flex;align-items:center;gap:16px;padding:10px 16px}
.logo{height:40px;max-width:140px;object-fit:contain;object-position:left}
.logoph{font-weight:800;color:hsl(var(--pri));letter-spacing:.04em;border:1.5px dashed hsl(var(--bd));padding:6px 10px;border-radius:8px;font-size:12px}
nav.top{display:none;gap:4px;margin-left:12px}
nav a,.tabs a{cursor:pointer;text-decoration:none;color:hsl(var(--mf));font-weight:600;font-size:14px;padding:8px 12px;border-radius:8px}
nav a.on{background:hsl(var(--mut));color:hsl(var(--pri))}
.tabs{position:fixed;bottom:0;left:0;right:0;background:hsl(var(--card));border-top:1px solid hsl(var(--bd));display:grid;grid-template-columns:repeat(6,1fr);padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
.tabs a{font-size:9px;text-align:center;padding:8px 2px}.tabs a b{display:block;font-size:18px}.tabs a.on{color:hsl(var(--acc))}
main{max-width:1000px;margin:0 auto;padding:16px 16px 96px}
.card{background:hsl(var(--card));border:1px solid hsl(var(--bd));border-radius:16px;padding:16px;box-shadow:0 2px 12px hsl(215 30% 40%/.06)}
.hero{border-radius:28px;padding:22px;background:radial-gradient(120% 90% at 0 0,hsl(var(--acc)/.10),transparent 60%),hsl(var(--card))}
h1{font-size:26px;margin:4px 0 14px;font-weight:800}h2{font-size:16px;margin:0 0 10px}
.g{display:grid;gap:12px}.g2{grid-template-columns:1fr}.g3{grid-template-columns:1fr}
@media(min-width:760px){.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr 1fr}nav.top{display:flex}.tabs{display:none}main{padding-bottom:40px}.hdr-r{display:flex!important}}
.hdr-r{display:none;align-items:center;gap:10px}
.btn{border:1px solid hsl(var(--bd));background:hsl(var(--card));color:hsl(var(--fg));border-radius:10px;padding:9px 14px;font:600 14px Manrope,sans-serif;cursor:pointer}
.btn.p{background:hsl(var(--pri));color:#fff;border-color:transparent}.btn.d{color:hsl(var(--des))}.btn.w{background:#25D366;color:#fff;border:0}
label{display:block}label .k{display:block;margin-bottom:5px}
input,select,textarea{width:100%;font:inherit;padding:10px;border:1px solid hsl(var(--bd));border-radius:10px;background:hsl(var(--card));color:hsl(var(--fg))}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.trailer{background:#2071E9}.torton{background:#8b5cf6}.camioneta{background:#9ca3af}
.chip{font:500 11px 'IBM Plex Mono',monospace;padding:3px 8px;border-radius:99px;display:inline-block}
.vigente{background:#dcfce7;color:#166534}.por_vencer{background:#fef9c3;color:#854d0e}.vencida{background:#fee2e2;color:#991b1b}.sin{background:hsl(var(--mut));color:hsl(var(--mf))}
.row{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid hsl(var(--bd));border-radius:14px;background:hsl(var(--card));margin-bottom:8px;cursor:pointer}
.date{width:46px;text-align:center;background:hsl(var(--mut));border-radius:10px;padding:5px 0;font-weight:800;line-height:1.1}
.sp{flex:1;min-width:0}.sp div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.seg .btn.on{background:hsl(var(--pri));color:#fff}
canvas.sig{width:100%;height:130px;border:1px dashed hsl(var(--bd));border-radius:10px;background:#fff;touch-action:none}
.thumbs{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.thumbs img{width:64px;height:64px;object-fit:cover;border-radius:8px;cursor:pointer}
.bar{position:fixed;left:0;right:0;bottom:0;background:hsl(var(--card));border-top:1px solid hsl(var(--bd));padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;justify-content:flex-end;z-index:7}
dialog{border:1px solid hsl(var(--bd));border-radius:16px;background:hsl(var(--card));color:hsl(var(--fg));max-width:460px;width:92%}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.sheetwrap{overflow-x:auto;background:hsl(var(--mut));padding:12px;border-radius:12px}
.sheet{width:8.5in;min-height:11in;background:#fff;color:#0f1c2e;padding:.32in;margin:0 auto;font-family:Manrope,sans-serif;font-size:11px}
.sheet .k{color:#667}.sheet .cell{border-bottom:1px solid #ccd;padding:3px 0}.sheet .cell b{display:block;font-size:12px}
.sheet .gal{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}.sheet .gal img{width:100%;aspect-ratio:1;object-fit:cover}
.sheet .box{border:1px solid #ccd;border-radius:6px;padding:6px}

body{font-size:16px}input,select,textarea{padding:13px;font-size:16px}

.q{background:hsl(var(--card));border:1px solid hsl(var(--bd));border-radius:12px;padding:18px;margin-bottom:12px}.q:focus-within{border-left:5px solid hsl(var(--acc))}
.qt{font-size:17px;font-weight:600}.qh{font-size:13px;color:hsl(var(--mf));margin:2px 0 10px}.q .qt+*:not(.qh){margin-top:10px}

.opt i{width:18px;height:18px;border:2px solid hsl(var(--mf));border-radius:50%}.opt.on{border-color:hsl(var(--acc));background:hsl(var(--acc)/.08)}.opt.on i{border-color:hsl(var(--acc));background:radial-gradient(hsl(var(--acc)) 45%,transparent 50%)}
